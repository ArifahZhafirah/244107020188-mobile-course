name: Flutter CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - 08-week-8-mid-project-review-code-review/**

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-week-8-mid-project-review-code-review/week5_offline_notes
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed lib test
      - run: flutter test
